
#################################
#   Backend + Rendering         #
#################################
backend = "glx";          # fastest for blur
vsync = true;             # prevents tearing
use-damage = true;        # reduce redraw load
shadow = false;

#################################
#   Transparency / Opacity      #
#################################
active-opacity   = 0.90;   # fully visible
inactive-opacity = 0.90;   # no dimming
inactive-dim     = 0.0;
frame-opacity    = 0.80;   # slight translucent border

opacity-rule = [
  "95:class_g = 'st-256color'",
  "85:class_g = 'St'",
  "95:class_g = 'Firefox'",
  "95:class_g = 'Brave-browser'",
  "95:class_g = 'Chromium'",
  "75:class_g = 'dmenu'",
  "75:class_g = 'Dunst'"
];

################################
#            Blur               #
#################################
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-kawase-strength = 4;

#################################
#            Corners            #
#################################
corner-radius = 4;
round-borders = 1;

#################################
#            Fading             #
#################################
fading = true;
fade-in-step  = 0.15;      # faster fade = snappy feel
fade-out-step = 0.15;
fade-delta = 15;
no-fading-openclose = false;

#################################
#       Performance Hacks       #
#################################
unredir-if-possible = true;     # disable compositor when fullscreen
detect-transient = true;
detect-client-leader = true;
refresh-rate = 0;               # auto
mark-wmwin-focused = true;
mark-ovredir-focused = true;
xrender-sync-fence = true;
