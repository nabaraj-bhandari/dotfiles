#################################
#   Transparency / Opacity      #
#################################
active-opacity    = 1.0;   # focused window: full
inactive-opacity  = 1.0;   # no dimming when unfocused
inactive-dim      = 0.0;   # never darken inactive
frame-opacity     = 0.75;   # borders slightly see-through

opacity-rule = [
  "1:class_g = 'dmenu_run'",
  "0.3:!class_g = 'dmenu_run'"
]

#################################
#   Window-specific Opacity     #
#################################
opacity-rule = [
  "75:class_g = 'Thunar'",
  "90:class_g = 'Firefox'",
  "90:class_g = 'Brave-browser'",
  "90:class_g = 'Chromium'",
  "90:class_g = 'st-256color'",
  "90:class_g = 'St'",
  "75:class_g = 'dmenu'",
  "70:class_g = 'Dunst'"
]

#################################
#            Shadows            #
#################################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity  = 0.5;

#################################
#            Blur               #
#################################
blur-method = "dual_kawase";
blur-strength = 10;

#################################
#            Corners            #
#################################
corner-radius = 4;

#################################
#            Fading             #
#################################
fading = true;
fade-in-step  = 0.03;
fade-out-step = 0.03;

#################################
#       General Settings        #
#################################
backend = "glx";          # best for blur
vsync   = true;
use-damage = true;

